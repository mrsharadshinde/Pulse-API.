name: Build and Test Pulse API

# Trigger this workflow every time code is pushed to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-suite:
    runs-on: ubuntu-latest

    # 1. Inject fake environment variables (since .env isn't pushed to GitHub)
    env:
      DATABASE_HOSTNAME: localhost
      DATABASE_PORT: 5432
      DATABASE_PASSWORD: supersecret_ci_password
      DATABASE_NAME: pulse
      DATABASE_USERNAME: postgres
      SECRET_KEY: fake_testing_key_12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    # 2. Spin up a temporary PostgreSQL database next to your code
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: supersecret_ci_password
          # Conftest.py appends '_test' to the DB name, so we must name this pulse_test!
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 3. The exact steps the server will take
    steps:
      - name: Pull code from repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run Pytest Sandbox
        run: |
          pytest -v